<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding RSVP - Babette & Felix</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Shared Styles -->
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Inline overrides if needed - prefer editing styles.css instead */
  </style>
  <body>
    <div class="container">
      <!-- Header -->
      <h1>Babette & Felix</h1>
      <p class="subtitle">We would love to celebrate with you</p>

      <!-- RSVP Form -->
      <form id="rsvp-form">
        <!-- Guest Name -->
        <label for="guestName">Guest Name</label>
        <input 
          id="guestName"
          name="entry.108083471" 
          type="text"
          placeholder="Enter your name"
          required 
        />

        <!-- Attending Status -->
        <label for="attending">Will you attend?</label>
        <select id="attending" name="entry.1418582323" required>
          <option value="" disabled selected>-- Please choose --</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>

        <!-- Plus One Name -->
        <label for="plusOne">Plus One Name (optional)</label>
        <input 
          id="plusOne"
          name="entry.2029894852" 
          type="text"
          placeholder="Enter guest name"
        />

        <!-- Number of Children -->
        <label for="children">Number of Children</label>
        <select id="children" name="entry.49562044">
          <option value="" disabled selected>-- Please choose --</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>

        <!-- Meal Preference -->
        <label for="meal">Meal Preference</label>
        <select id="meal" name="entry.833697438">
          <option value="" disabled selected>-- Please choose --</option>
          <option value="Meat">Meat</option>
          <option value="Vegetarian">Vegetarian</option>
        </select>

        <!-- Submit Button -->
        <button type="submit">Send RSVP</button>
      </form>

      <!-- Success Message (hidden by default) -->
      <p id="thanks" class="hidden">Thank you! 💕</p>

      <!-- Back to Overview Link -->
      <a href="overview.html" class="back-link" style="display: inline-block; margin-top: 20px; font-size: 14px; color: #1f1f1f; text-decoration: none; border-bottom: 1px solid rgba(31, 31, 31, 0.4);">← Back to Overview</a>
    </div>

    <!-- Hidden form for Google Forms submission -->
    <form
      id="rsvpForm"
      action="https://docs.google.com/forms/d/1eV14AgFXLGabdGzHrBHquWLiP-aAkAuaweCw5LsJkDE/formResponse"
      method="POST"
      style="display: none;"
    ></form>

    <!-- TRANSLATIONS & LOCALIZATION -->
    <script>
      /**
       * TRANSLATION STRINGS
       * 
       * To add a new language:
       * 1. Add a new language object to translations (e.g., "fr" for French)
       * 2. Add corresponding translation keys
       * 3. Update the language detection logic if needed
       */
      const translations = {
        en: {
          guestName: "Guest Name",
          attending: "Will you attend?",
          yes: "Yes",
          no: "No",
          plusOne: "Plus One Name (optional)",
          numChildren: "Number of Children",
          select: "Please choose...",
          meal: "Meal Preference",
          meat: "Meat",
          vegetarian: "Vegetarian",
          send: "Send RSVP",
          thankYou: "Thank you! 💕",
        },
        de: {
          guestName: "Dein Name",
          attending: "Kommst du?",
          yes: "Ja",
          no: "Nein",
          plusOne: "Hast du ein +1? (optional)",
          numChildren: "Anzahl der Kinder (falls du welche hast)",
          select: "Bitte wählen...",
          meal: "Was willst du essen?",
          meat: "Fleisch",
          vegetarian: "Vegetarisch",
          send: "RSVP absenden",
          thankYou: "Danke! 💕",
        },
        dk: {
          guestName: "Dit navn",
          attending: "Kommer du?",
          yes: "Ja",
          no: "Nej",
          plusOne: "Navn på din ledsager (valgfrit)",
          numChildren: "Antal børn (valgfrit)",
          select: "Vælg venligst...",
          meal: "Hvad vil du spise?",
          meat: "Kød",
          vegetarian: "Vegetarisk",
          send: "Send RSVP",
          thankYou: "Tak! 💕",
        },
      };

      /**
       * Apply language translations to the page
       * Updates all form labels, placeholders, and buttons
       */
      function applyLanguage(lang) {
        const t = translations[lang] || translations.en;
        
        // Update all form labels
        const labelMap = {
          'label[for="guestName"]': t.guestName,
          'label[for="attending"]': t.attending,
          'label[for="plusOne"]': t.plusOne,
          'label[for="children"]': t.numChildren,
          'label[for="meal"]': t.meal,
        };

        Object.entries(labelMap).forEach(([selector, text]) => {
          const el = document.querySelector(selector);
          if (el) el.textContent = text;
        });

        // Update form options
        const attending = document.getElementById("attending");
        if (attending) {
          const yesOpt = attending.querySelector('option[value="Yes"]');
          const noOpt = attending.querySelector('option[value="No"]');
          const selectOpt = attending.querySelector('option[disabled]');
          if (yesOpt) yesOpt.textContent = t.yes;
          if (noOpt) noOpt.textContent = t.no;
          if (selectOpt) selectOpt.textContent = t.select;
        }

        const children = document.getElementById("children");
        if (children) {
          const selectOpt = children.querySelector('option[disabled]');
          if (selectOpt) selectOpt.textContent = t.select;
        }

        const meal = document.getElementById("meal");
        if (meal) {
          const meatOpt = meal.querySelector('option[value="Meat"]');
          const vegOpt = meal.querySelector('option[value="Vegetarian"]');
          const selectOpt = meal.querySelector('option[disabled]');
          if (meatOpt) meatOpt.textContent = t.meat;
          if (vegOpt) vegOpt.textContent = t.vegetarian;
          if (selectOpt) selectOpt.textContent = t.select;
        }

        // Update submit button
        const submitBtn = document.querySelector('#rsvp-form button[type="submit"]');
        if (submitBtn) submitBtn.textContent = t.send;

        // Update thank you message
        const thanksEl = document.getElementById("thanks");
        if (thanksEl) thanksEl.textContent = t.thankYou;
      }

      /**
       * Initialize language on page load
       * Checks localStorage first, then browser language, defaults to English
       */
      (function initializeLanguage() {
        // Check if user previously selected a language
        let initial = localStorage.getItem("selectedLanguage");
        
        // If not, detect from browser language
        if (!initial) {
          const userLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
          initial = "en";
          if (userLang.startsWith("de")) initial = "de";
          else if (userLang.startsWith("da")) initial = "dk";
        }
        
        applyLanguage(initial);
      })();
    </script>

    <!-- FORM LOGIC -->
    <script>
      /**
       * Toggle visibility of additional fields
       * Shows plus one, children, and meal preference only when:
       * 1. Guest name is filled in AND
       * 2. Guest confirms they are attending
       */
      function toggleExtras() {
        const guestNameInput = document.getElementById("guestName");
        const attendingSelect = document.getElementById("attending");
        
        const nameFilled = guestNameInput && guestNameInput.value.trim() !== "";
        const isAttending = attendingSelect && attendingSelect.value === "Yes";

        // Elements to toggle
        const fieldIds = ["plusOne", "children", "meal"];
        const labelSelectors = fieldIds.map(id => `label[for="${id}"]`);

        // Helper function to set visibility
        const setVisible = (visible) => {
          fieldIds.forEach(id => {
            const field = document.getElementById(id);
            if (field) field.style.display = visible ? "block" : "none";
          });
          
          labelSelectors.forEach(selector => {
            const label = document.querySelector(selector);
            if (label) label.style.display = visible ? "block" : "none";
          });
        };

        // Show extras only if name is filled AND attending
        setVisible(nameFilled && isAttending);
      }

      // Attach event listeners for dynamic form behavior
      const guestNameInput = document.getElementById("guestName");
      const attending = document.getElementById("attending");
      
      if (guestNameInput) guestNameInput.addEventListener("input", toggleExtras);
      if (attending) attending.addEventListener("change", toggleExtras);
      
      // Initialize visibility on page load
      toggleExtras();

      /**
       * Handle form submission
       * Submits data to Google Forms and redirects to thank you page
       */
      const visibleForm = document.getElementById("rsvp-form");
      const hiddenForm = document.getElementById("rsvpForm");
      
      if (visibleForm) {
        visibleForm.addEventListener("submit", (e) => {
          e.preventDefault();
          
          const guestName = document.getElementById("guestName").value;
          console.log("Form submitted with guest name:", guestName);
          
          const formData = new FormData(visibleForm);
          const googleFormUrl = hiddenForm?.action || null;
          
          console.log("Form data entries:");
          for (let [key, value] of formData.entries()) {
            console.log(`  ${key}: ${value}`);
          }
          
          // Submit to Google Forms (no-cors to avoid CORS errors with third-party forms)
          if (googleFormUrl) {
            fetch(googleFormUrl, {
              method: "POST",
              mode: "no-cors",
              body: formData,
            }).finally(() => {
              // Redirect to thank you page after submission
              window.location.href = "thankyou.html";
            });
          } else {
            // Fallback if no external form configured
            window.location.href = "thankyou.html";
          }
        });
      }
    </script>
  </body>
</html>
