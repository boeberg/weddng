<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thank you</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        text-align: center;
        background: #fff7fb;
        color: #2b2b2b;
      }
      .card {
        max-width: 640px;
        width: 100%;
        background: white;
        border-radius: 12px;
        padding: 2.5rem;
        box-shadow: 0 6px 30px rgba(31, 31, 31, 0.08);
      }
      .heart {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 0.5rem;
        color: #e2557a;
      }
      h1 {
        margin: 0.25rem 0 0.5rem 0;
        font-size: 1.75rem;
      }
      p {
        margin: 0.5rem 0;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.6rem 1rem;
        background: #2b6bf6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card" role="main" aria-labelledby="thanks-heading">
      <div class="heart" aria-hidden="true">💕</div>
      <h1 id="thanks-heading">Thank you!</h1>
      <p>Your RSVP has been received.</p>
      <p>Danke! Deine Antwort wurde empfangen.</p>
      <a class="button" href="index.html">Back to form</a>
    </div>
  </body>
</html>
