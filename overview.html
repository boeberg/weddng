<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Babette & Felix</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: linear-gradient(180deg, #f7f5f2, #ece9e4);
        color: #333;
      }

      .container {
        max-width: 480px;
        margin: 60px auto;
        background: white;
        padding: 40px 32px;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 14px;
        color: #777;
        margin-bottom: 40px;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      a.button {
        display: block;
        text-decoration: none;
        padding: 14px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 500;
        text-align: center;
      }

      .primary {
        background: #b89b5e;
        color: white;
      }

      .primary:hover {
        background: #a88b4f;
      }

      .secondary {
        border: 1px solid #b89b5e;
        color: #b89b5e;
      }

      .secondary:hover {
        background: #f6f2e9;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Babette & Felix</h1>
      <div class="subtitle">
        We’re so happy to celebrate our wedding with you
      </div>

      <div class="button-group">
        <a href="index.html" class="button primary"> RSVP </a>

        <a href="info.html" class="button secondary"> Practical Information </a>
      </div>
    </div>
  </body>
</html>
