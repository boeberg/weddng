<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babette & Felix - Wedding</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Shared Styles -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Inline overrides if needed - prefer editing styles.css instead */
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <h1>Babette & Felix</h1>
    <p class="subtitle" id="subtitle">
      We're so happy to celebrate our wedding with you
    </p>

    <!-- Language Switch -->
    <div class="language-switch">
      <button onclick="setLanguage('en')" class="active" data-lang="en">
        EN
      </button>
      <button onclick="setLanguage('de')" data-lang="de">DE</button>
      <button onclick="setLanguage('dk')" data-lang="dk">DK</button>
    </div>

    <!-- Navigation Buttons -->
    <div class="button-group">
      <a href="index.html" class="btn btn-primary" id="rsvpBtn">RSVP</a>
      <a href="info.html" class="btn btn-secondary" id="infoBtn">Practical Information</a>
    </div>
  </div>

  <!-- TRANSLATIONS & LANGUAGE LOGIC -->
  <script>
      /**
       * OVERVIEW PAGE - LANGUAGE SWITCHER
       *
       * This page displays the language switch buttons.
       * Selected language is stored in localStorage and applied to the RSVP form.
       *
       * To add a new language:
       * 1. Add translation object below
       * 2. Update language detection in initializeLanguage()
       */
      const translations = {
        en: {
          subtitle: "We're so happy to celebrate our wedding with you",
          rsvp: "RSVP",
          info: "Practical Information",
        },
        de: {
          subtitle: "Wir freuen uns, unsere Hochzeit mit dir zu feiern",
          rsvp: "RSVP",
          info: "Praktische Informationen",
        },
        dk: {
          subtitle: "Vi glæder os til at fejre vores bryllup med dig",
          rsvp: "RSVP",
          info: "Praktiske oplysninger",
        },
      };

      /**
       * Apply language translations to the overview page
       */
      function applyLanguage(lang) {
        const t = translations[lang] || translations.en;

        const subtitleEl = document.getElementById("subtitle");
        if (subtitleEl) subtitleEl.textContent = t.subtitle;

        const rsvpBtn = document.getElementById("rsvpBtn");
        if (rsvpBtn) rsvpBtn.textContent = t.rsvp;

        const infoBtn = document.getElementById("infoBtn");
        if (infoBtn) infoBtn.textContent = t.info;
      }

      /**
       * Update active button styling
       */
      function setActiveButton(lang) {
        const buttons = document.querySelectorAll(".language-switch button");
        buttons.forEach((btn) => {
          const btnLang = (btn.dataset.lang || btn.textContent || "")
            .toString()
            .trim()
            .toLowerCase();

          if (btnLang === lang) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });
      }

      /**
       * Set the current language and store in localStorage
       * This persists the choice so the RSVP form shows in the selected language
       */
      function setLanguage(lang) {
        lang = (lang || "").toString().toLowerCase();

        // Map Danish to Danish translations
        if (lang === "da") lang = "dk";

        // Default to English if language not found
        if (!translations[lang]) lang = "en";

        // Store selection for other pages
        localStorage.setItem("selectedLanguage", lang);

        // Update display
        applyLanguage(lang);
        setActiveButton(lang);
      }

      /**
       * Initialize page language on load
       * Checks localStorage first, then browser language preference
       */
      (function initializeLanguage() {
        let initial = localStorage.getItem("selectedLanguage");

        // If no saved preference, detect from browser
        if (!initial) {
          const browserLang = (
            navigator.language ||
            navigator.userLanguage ||
            "en"
          ).toLowerCase();
          initial = "en";
          if (browserLang.startsWith("de")) initial = "de";
          else if (browserLang.startsWith("da")) initial = "dk";
        }

        applyLanguage(initial);
        setActiveButton(initial);
      })();
    </script>
  </body>
</html>
